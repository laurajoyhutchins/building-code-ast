id: decision.staged-representations
kind: decision
payload:
  consequences:
    - Document and provision ASTs are versioned independently.
    - Later graph and evaluation stages must retain links to earlier source evidence.
    - Consumers must choose the representation matching their compiler stage.
  decision: Do not place modality, applicability, actions, compliance conclusions, or professional interpretation in the document structure AST.
  rationale: Separate stages preserve reviewability, allow parsers to evolve independently, and prevent later interpretation from overwriting source structure.
