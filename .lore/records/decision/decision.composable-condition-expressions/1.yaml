id: decision.composable-condition-expressions
kind: decision
payload:
  consequences:
    - Provision AST 0.3.0 is intentionally incompatible with 0.2.0.
    - The initial parser may emit only one homogeneous logical group level even though the runtime model and schema permit recursion.
    - Mixed, grouped, or malformed candidate chains fail closed with deterministic diagnostics and no partial semantic output.
    - The decision is approved; implementation remains a separate change.
  decision: Replace ProvisionAst.conditions with ProvisionAst.condition, whose value is null, one comparison, an all_of group, or an any_of group.
  rationale: The flat 0.2.0 tuple cannot preserve conjunction, disjunction, or future nested logical structure without ambiguity.
