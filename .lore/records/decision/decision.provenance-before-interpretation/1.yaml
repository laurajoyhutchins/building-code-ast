id: decision.provenance-before-interpretation
kind: decision
payload:
  consequences:
    - Derived nodes carry exact evidence spans.
    - Unsupported language remains visible through diagnostics.
    - Model-assisted extensions must satisfy the same contracts and may not bypass deterministic validation.
  decision: Treat provenance and uncertainty as first-class contract data rather than incidental parser metadata.
  rationale: Regulatory language is high-consequence and often ambiguous; downstream review must be able to reconstruct exactly what text supported each structure.
