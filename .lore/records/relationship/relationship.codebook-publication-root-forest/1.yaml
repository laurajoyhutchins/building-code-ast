id: relationship.codebook-publication-root-forest
kind: relationship
payload:
  consequences:
    - Publication-specific follow-up work stays scoped to its codebook family.
    - Generic compiler changes remain independent when they apply across publication families.
    - A publication root records ownership and provenance; it does not create parser or semantic support by itself.
    - Source-profile PRs may become independent main-based descendants after their publication root is integrated.
  relationship: publication-specific work descends from a durable publication-family root
