id: procedure.verification
kind: procedure
title: Verify repository changes
summary: Run the repository-owned Python verification contract, then validate reviewed LORE knowledge and committed projections.
details:
  - Run python tools/verify_repository.py from the repository root on Python 3.12.13.
  - Run the pinned LORE validate and project --check commands.
  - Report the exact commands actually run and do not claim validation that was not performed.
  - Reviewed knowledge changes use normal Git commits and pull requests; there is no proposal or apply lifecycle.
evidence:
  - path: CONTRIBUTING.md
  - path: .github/workflows/ci.yml
  - path: lore.yaml
