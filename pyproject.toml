[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "building-code-ast"
version = "0.2.0.dev0"
description = "Provenance-preserving ASTs for selected natural-language building-code provisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Laura Joy Hutchins" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
nec-pdf = ["PyMuPDF>=1.24,<2"]

[project.scripts]
building-code-ast = "building_code_ast.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
building_code_ast = ["py.typed"]
