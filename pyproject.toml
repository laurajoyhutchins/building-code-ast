[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "building-code-ast"
version = "0.3.0.dev0"
description = "Provenance-preserving ASTs for selected natural-language building-code provisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
authors = [{ name = "Laura Joy Hutchins" }]
dependencies = []
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Typing :: Typed",
]

[project.optional-dependencies]
ibc-pdf = ["PyMuPDF>=1.24,<2"]
nec-pdf = ["PyMuPDF>=1.24,<2"]
evidence-pdf = ["PyMuPDF>=1.24,<2"]
pdf-inspection = ["PyMuPDF>=1.24,<2"]
pdf-enrichment = ["PyMuPDF>=1.24,<2", "pypdf>=6,<7"]
validation = ["jsonschema>=4.23,<5"]

[project.scripts]
building-code-ast = "building_code_ast.cli:main"
building-code-source-audit = "building_code_ast.source_audit_cli:main"
building-code-text = "building_code_ast.source_text_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
building_code_ast = ["py.typed"]
