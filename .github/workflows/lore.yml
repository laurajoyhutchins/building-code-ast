name: LORE

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Check out pinned LORE
        uses: actions/checkout@v4
        with:
          repository: laurajoyhutchins/LORE
          ref: a8792bd594db34fcbf3065239b70ef4383f7e186
          path: _lore_tool

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build pinned LORE
        shell: bash
        run: |
          set -euo pipefail
          mv _lore_tool "$RUNNER_TEMP/lore"
          cd "$RUNNER_TEMP/lore"
          node scripts/restore-verified-lockfile.mjs
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Bootstrap or verify LORE knowledge
        shell: bash
        run: |
          set -euo pipefail
          LORE="$RUNNER_TEMP/lore/dist/src/cli/main.js"

          if find .lore/records -type f -name '*.yaml' -print -quit 2>/dev/null | grep -q .; then
            node "$LORE" validate
            node "$LORE" project --check
          else
            mkdir -p .lore/context .lore/proposals
            node "$LORE" context .lore/tasks/bootstrap-documentation.yaml \
              > .lore/context/bootstrap-documentation.yaml

            base_revision="$(git rev-parse HEAD)"
            skill_digest="$(sha256sum skills/maintain-repository-documentation/SKILL.md | awk '{print $1}')"
            sed \
              -e "s/__BASE_REVISION__/${base_revision}/g" \
              -e "s/__SKILL_DIGEST__/${skill_digest}/g" \
              -e 's/"document-structure"/"component.document-structure"/g' \
              -e 's/"provision-parser"/"component.provision-parser"/g' \
              -e 's/"validation"/"component.validation"/g' \
              .lore/proposals/bootstrap-documentation.template.yaml \
              > .lore/proposals/bootstrap-documentation.generated.yaml

            node <<'NODE'
          const fs = require('node:fs');
          const proposalPath = '.lore/proposals/bootstrap-documentation.generated.yaml';
          const proposal = JSON.parse(fs.readFileSync(proposalPath, 'utf8'));
          for (const operation of proposal.operations) {
            const record = operation.record;
            if (record?.id === 'procedure.verification') {
              record.summary = 'Run the Python test and compilation lanes, then use the pinned LORE CLI to verify accepted records and generated projections.';
              record.payload.commands = record.payload.commands.filter(
                (command) => command !== 'lore extract --check',
              );
            }
          }
          proposal.uncertainties[1] = "LORE's shipped extractors are TypeScript- and Vitest-oriented, so deterministic extraction is intentionally disabled for this Python repository.";
          fs.writeFileSync(proposalPath, `${JSON.stringify(proposal, null, 2)}\n`);
          NODE

            node "$LORE" validate-proposal .lore/proposals/bootstrap-documentation.generated.yaml
            node "$LORE" apply .lore/proposals/bootstrap-documentation.generated.yaml
            node "$LORE" validate
            node "$LORE" project --check
          fi

      - name: Upload LORE state
        uses: actions/upload-artifact@v4
        with:
          name: lore-state
          if-no-files-found: error
          path: |
            .lore/context/bootstrap-documentation.yaml
            .lore/proposals/bootstrap-documentation.generated.yaml
            .lore/records
            .lore/transactions
            docs/generated
