name: Finalize issue 38 archaeology

on:
  push:
    branches:
      - agent/issue-38-deciduous-regeneration

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Remove one-shot workflow from final tree
        run: |
          rm .github/workflows/finalize-issue-38.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: remove issue 38 finalizer'
          git push
      - name: Regenerate and validate
        run: |
          python scripts/validate_archaeology.py --write
          python scripts/validate_archaeology.py
          python -m unittest tests.test_archaeology -v
      - name: Commit projections
        run: |
          git add -A
          git commit -m 'docs: finalize regenerated Deciduous projections'
          git push
