name: FF source transport

on:
  push:
    branches:
      - ff/verify-transport-ljh-250-7q2k

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package exact source tree
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD
          git rev-parse HEAD:src
          tar -czf source.tgz src pyproject.toml
          sha256sum source.tgz
      - uses: actions/upload-artifact@v4
        with:
          name: ljh-250-refreshed-source
          path: source.tgz
          if-no-files-found: error
          retention-days: 1
