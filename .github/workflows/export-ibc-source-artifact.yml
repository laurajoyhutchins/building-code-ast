name: Export exact IBC source snapshots

on:
  pull_request:
    branches:
      - agent/ibc-layout-analysis

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Archive immutable repository snapshots
        shell: bash
        run: |
          set -euo pipefail
          git archive \
            --format=tar.gz \
            --output=building-code-ast-main-c8df331.tar.gz \
            c8df331cbf6bf5b286acebb0f1e520f40d0fbb17
          git archive \
            --format=tar.gz \
            --output=building-code-ast-ibc-layout-270410a.tar.gz \
            270410a1e3fa6217887d74167f28702ad46f9967
          sha256sum \
            building-code-ast-main-c8df331.tar.gz \
            building-code-ast-ibc-layout-270410a.tar.gz \
            > building-code-ast-source-snapshots.sha256
          test "$(wc -c < building-code-ast-main-c8df331.tar.gz)" -gt 0
          test "$(wc -c < building-code-ast-ibc-layout-270410a.tar.gz)" -gt 0

      - name: Upload exact source artifacts
        uses: actions/upload-artifact@v4
        with:
          name: building-code-ast-source-snapshots
          path: |
            building-code-ast-main-c8df331.tar.gz
            building-code-ast-ibc-layout-270410a.tar.gz
            building-code-ast-source-snapshots.sha256
          if-no-files-found: error
          retention-days: 3
