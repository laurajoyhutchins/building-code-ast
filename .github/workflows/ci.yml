name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package
        run: python -m pip install -e .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src tests

  official-evidence-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PDF validation dependencies
        run: python -m pip install -e '.[evidence-pdf]'
      - name: Inspect source-free ICC development diagnostics
        run: python tools/debug_official_development.py
      - name: Inspect source-free WAC layout diagnostics
        run: python tools/debug_wac_layout.py
      - name: Validate registered official evidence
        run: python tools/validate_official_evidence.py
      - uses: actions/upload-artifact@v4
        with:
          name: official-evidence-validation
          path: official-evidence-validation.json
          if-no-files-found: error
          retention-days: 1
