name: Apply reviewed layout fixes

on:
  pull_request:

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.pull_request.head.ref == 'agent/ibc-layout-analysis'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply verified patch
        shell: bash
        run: |
          printf '%s' '' | base64 -d | gzip -d > /tmp/ibc-layout-fixes.patch
          git apply --check /tmp/ibc-layout-fixes.patch
          git apply /tmp/ibc-layout-fixes.patch
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
            push:
              branches: [main]

          permissions:
            contents: read

          jobs:
            test:
              runs-on: ubuntu-latest
              steps:
                - uses: actions/checkout@v4
                - uses: actions/setup-python@v5
                  with:
                    python-version: "3.12"
                - name: Install package
                  run: python -m pip install -e .
                - name: Run unit tests
                  run: python -m unittest discover -s tests -v
                - name: Compile sources
                  run: python -m compileall -q src tests
          YAML
      - name: Install package
        run: python -m pip install -e .
      - name: Run full unit suite
        run: python -m unittest discover -s tests -v
      - name: Compile sources
        run: python -m compileall -q src scripts tests
      - name: Create candidate commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "fix: preserve IBC layout ordering and cell provenance"
          git push --force origin HEAD:refs/heads/agent/ibc-layout-analysis-candidate
          git rev-parse HEAD > candidate-sha.txt
      - name: Upload candidate SHA
        uses: actions/upload-artifact@v4
        with:
          name: ibc-layout-fix-candidate
          path: candidate-sha.txt
          retention-days: 1
