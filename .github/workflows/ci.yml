name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: python -m pip install --upgrade "setuptools>=75" wheel
      - name: Install package
        run: python -m pip install -e '.[validation]'
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Validate source-safe IBC corpus
        run: python tools/validate_ibc_2018_corpus.py corpora/ibc-2018
      - name: Validate IBC JSON Schemas
        run: python tools/validate_ibc_2018_schemas.py corpora/ibc-2018 schemas
      - name: Compile sources
        run: python -m compileall -q src scripts tools tests
      - name: Build wheel
        run: python -m pip wheel . --no-deps --no-build-isolation -w dist
