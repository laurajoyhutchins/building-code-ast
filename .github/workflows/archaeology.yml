name: Deciduous archaeology

on:
  pull_request:
  push:
    branches:
      - main
      - agent/deciduous-archaeology-backfill

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Regenerate archaeology package on archaeology branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/deciduous-archaeology-backfill'
        run: |
          python scripts/validate_archaeology.py --write
          python - <<'PY'
          from pathlib import Path

          path = Path('docs/archaeology/narratives.md')
          heading = '## Section-first code addressing'
          section = '''## Section-first code addressing
          > Use the code publication's own hierarchy as the durable coordinate system.

          **Current state:** Draft PR #33 implements and verifies section-first addressing. Sections, subsections, tables, figures, exceptions, definitions, and equations are primary navigation coordinates. PDF pages remain secondary provenance.

          **Evolution:**
          1. Page coordinates were retained to reproduce source evidence and debug extraction.
          2. **PIVOT:** Engineers navigate and cite code by sections and subsections, while pagination varies across editions, printings, and source files.
          3. The section-addressing contract now forbids page-derived fallback identities and bases ordering and edition comparison on structural code addresses and explicit renumbering relationships.

          **Evidence:** Draft PR #33 at `3740ea3435ed7c2092ddb07001325d4b8ce3ba77`; `docs/reference/section-addressing.md` on `agent/ibc-2018-closeout`.
          **Status:** branch-only pending merge of PR #33.
          '''
          text = path.read_text(encoding='utf-8')
          if heading not in text:
              path.write_text(text.rstrip() + '\n\n' + section.strip() + '\n', encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deciduous/exports/building-code-ast-archaeology.json docs/archaeology/graph.dot docs/archaeology/current-architecture.json docs/archaeology/status-summary.json docs/archaeology/manifest.json docs/archaeology/narratives.md
          if git diff --cached --quiet; then
            echo "Archaeology package already current"
          else
            git commit -m "docs: regenerate Deciduous archaeology package"
            git push origin HEAD:agent/deciduous-archaeology-backfill
          fi
      - name: Validate deterministic graph and projections
        run: |
          python scripts/validate_archaeology.py
          python -m unittest tests.test_archaeology -v
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
