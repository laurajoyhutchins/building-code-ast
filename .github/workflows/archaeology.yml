name: Deciduous archaeology

on:
  pull_request:
  push:
    branches:
      - main
      - agent/deciduous-archaeology-backfill

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install package
        run: python -m pip install -e .
      - name: Regenerate projections on archaeology branch
        if: github.event_name == 'push' && github.ref == 'refs/heads/agent/deciduous-archaeology-backfill'
        run: |
          python scripts/validate_archaeology.py --write
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .deciduous/exports/building-code-ast-archaeology.json docs/archaeology/graph.dot docs/archaeology/current-architecture.json docs/archaeology/status-summary.json docs/archaeology/manifest.json
          if git diff --cached --quiet; then
            echo "Projections already current"
          else
            git commit -m "docs: regenerate Deciduous projections"
            git push origin HEAD:agent/deciduous-archaeology-backfill
          fi
      - name: Validate deterministic graph and projections
        run: |
          python scripts/validate_archaeology.py
          python -m unittest tests.test_archaeology -v
      - name: Run repository tests
        run: python -m unittest discover -s tests -v
