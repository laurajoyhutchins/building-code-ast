name: provenance-cutover-final-fix

on:
  push:
    branches:
      - refactor/source-provenance-cutover
    paths:
      - tools/fix_provenance_cutover_ci.py
      - .github/workflows/provenance-cutover-final-fix.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-provenance-cutover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final provenance cutover fixes
        run: python tools/fix_provenance_cutover_ci.py
      - name: Commit fixes
        run: |
          if git diff --quiet; then
            echo "No fixes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tools/validate_ibc_2018_corpus.py tests/test_ashrae621_2016_document_ast.py tests/test_ashrae901_2016_document_ast.py
          git commit -m "fix: finish normalized provenance cutover"
          git push origin HEAD:refactor/source-provenance-cutover
