name: provenance-test-migrate

on:
  push:
    branches:
      - refactor/source-provenance-cutover
    paths:
      - tools/migrate_provenance_tests.py
      - tests/provenance_fixtures.py
      - .github/workflows/provenance-test-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-provenance-cutover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Migrate provenance test consumers
        run: python tools/migrate_provenance_tests.py
      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests
          git commit -m "test: migrate provenance consumers to canonical source packages"
          git push origin HEAD:refactor/source-provenance-cutover
