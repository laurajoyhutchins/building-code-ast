name: provenance-cutover-migrate

on:
  push:
    branches:
      - refactor/source-provenance-cutover
    paths:
      - tools/provenance_cutover_migrate.py
      - .github/workflows/provenance-cutover-migrate.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/source-provenance-cutover
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply normalized provenance migration
        run: python tools/provenance_cutover_migrate.py
      - name: Verify legacy authority is absent from source
        run: |
          ! grep -R -n -E 'SourceRegisterEntry|PublicationIdentity|source_register_from_dict|SourceObjectCatalog' src/building_code_ast
      - name: Commit migration
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'No migration changes to commit.'
            exit 0
          fi
          git commit -m 'refactor: migrate provenance consumers'
          git push origin HEAD:refactor/source-provenance-cutover
